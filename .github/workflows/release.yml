name: Publish resource pack

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build resource pack
        run: |
          python3 -m json.tool pack.mcmeta > /dev/null
          python3 -m json.tool assets/minecraft/font/default.json > /dev/null
          python3 -m zipfile -c resource-pack.zip pack.mcmeta pack.png assets
          python3 -m zipfile -t resource-pack.zip
          sha1sum resource-pack.zip | cut -d ' ' -f 1 > resource-pack.sha1

      - name: Publish branch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}"
          read -r hash < resource-pack.sha1
          {
            echo "Resource pack da branch $GITHUB_REF_NAME, commit $GITHUB_SHA."
            echo
            echo 'Configuração pronta para o server.properties:'
            echo '```properties'
            echo "resource-pack=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/resource-pack.zip"
            echo "resource-pack-sha1=$hash"
            echo 'require-resource-pack=true'
            echo '```'
          } > release-notes.md
          options=(--target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md)
          if [[ "$GITHUB_REF_NAME" == dev ]]; then
            options+=(--prerelease --latest=false)
          else
            options+=(--latest)
          fi
          gh release create "$tag" resource-pack.zip resource-pack.sha1 "${options[@]}"
